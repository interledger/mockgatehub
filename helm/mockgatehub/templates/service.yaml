apiVersion: v1
kind: Service
metadata:
  name: {{ include "mockgatehub.fullname" . }}
  labels:
    {{- include "mockgatehub.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # Only the application port. The admin listener has its own Service so the
    # two can be exposed independently.
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mockgatehub.selectorLabels" . | nindent 4 }}
