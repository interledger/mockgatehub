apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mockgatehub.fullname" . }}
  labels:
    {{- include "mockgatehub.labels" . | nindent 4 }}
data:
  MOCKGATEHUB_PORT: {{ .Values.ports.http | quote }}
  MOCKGATEHUB_ADMIN_PORT: {{ .Values.ports.admin | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  MOCKGATEHUB_REDIS_URL: {{ include "mockgatehub.redisUrl" . | quote }}
  MOCKGATEHUB_REDIS_DB: {{ .Values.config.redisDb | quote }}
  MOCKGATEHUB_ENFORCE_AUTHENTICATION: {{ .Values.config.enforceAuthentication | quote }}
  DEFAULT_ORGANIZATION_ID: {{ .Values.config.defaultOrganizationId | quote }}
  WEBHOOK_URL: {{ .Values.config.webhookUrl | quote }}
  WEBHOOK_MIN_DELAY_SEC: {{ .Values.config.webhookMinDelaySec | quote }}
  MOCKGATEHUB_PUBLIC_BASE_URL: {{ include "mockgatehub.publicBaseUrl" . | quote }}
  MOCKGATEHUB_ASYNC_WITHDRAWALS: {{ .Values.config.asyncWithdrawals | quote }}
