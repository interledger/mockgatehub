{{- if not .Values.credentials.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mockgatehub.secretName" . }}
  labels:
    {{- include "mockgatehub.labels" . | nindent 4 }}
type: Opaque
stringData:
  MOCKGATEHUB_VALID_CREDENTIALS: {{ .Values.credentials.validCredentials | quote }}
  WEBHOOK_SECRET: {{ .Values.credentials.webhookSecret | quote }}
  # Empty is meaningful: MockGatehub then generates a per-process secret.
  MOCKGATEHUB_CARD_DATA_TOKEN_SECRET: {{ .Values.credentials.cardDataTokenSecret | quote }}
{{- end }}
