name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  # Lint: gofmt, go vet (including the e2e-tagged sources) and golangci-lint.
  # Runs `make lint` so CI and a developer's machine check the same things.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # Must satisfy the `version: "2"` schema in .golangci.yml.
      GOLANGCI_VERSION: 2.10.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache Go build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache golangci-lint analysis
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-${{ env.GOLANGCI_VERSION }}-${{ hashFiles('.golangci.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-${{ env.GOLANGCI_VERSION }}-

      - name: Download dependencies
        run: go mod download

      - name: Install golangci-lint
        run: |
          curl -sSLo golangci-lint.tar.gz \
            "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_VERSION}/golangci-lint-${GOLANGCI_VERSION}-linux-amd64.tar.gz"
          tar -xzf golangci-lint.tar.gz --strip-components=1 \
            "golangci-lint-${GOLANGCI_VERSION}-linux-amd64/golangci-lint"
          sudo install -m 0755 golangci-lint /usr/local/bin/golangci-lint
          golangci-lint --version

      - name: Run linters
        run: make lint

  # Run unit and integration tests before releasing
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache Go build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit and integration tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          files: ./coverage.out
          flags: unittests

  # Run e2e tests (requires Docker)
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache Go build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run feature e2e tests
        run: go test -tags e2e -v -count=1 ./testenv/ -run TestFeatures

  # Validate the Helm chart: lint, unit tests and schema validation of the
  # rendered manifests. Fast and needs no cluster.
  helm:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 0.8.1

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Lint, unit test and validate the chart
        run: make helm-test

  # Semantic release to determine version and create changelog
  release:
    name: Semantic Release
    needs: [lint, test, e2e, helm]
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_major_version: ${{ steps.semantic.outputs.new_release_major_version }}
      new_release_minor_version: ${{ steps.semantic.outputs.new_release_minor_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release@^23 \
            @semantic-release/github@^10 \
            conventional-changelog-conventionalcommits@^7

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # Run semantic-release and capture output for parsing
          npx semantic-release 2>&1 | tee /tmp/semantic-release-output.txt
          
          # Check if a new release was published by looking for success message
          if grep -q "Published release" /tmp/semantic-release-output.txt; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            
            # Extract version from "The next release version is X.Y.Z" 
            VERSION=$(grep "The next release version is" /tmp/semantic-release-output.txt | sed -E 's/.*The next release version is ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            echo "new_release_version=$VERSION" >> $GITHUB_OUTPUT
            
            # Extract major and minor versions
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            echo "new_release_major_version=$MAJOR" >> $GITHUB_OUTPUT
            echo "new_release_minor_version=$MINOR" >> $GITHUB_OUTPUT
            
            echo "✅ New release published: v$VERSION (major: $MAJOR, minor: $MINOR)"
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No new release published"
          fi

  # Build and push multi-platform Docker images
  docker:
    name: Build and Push Docker Images
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}},value=v${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=v${{ needs.release.outputs.new_release_version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

  # Package the Helm chart and publish it to the `published` branch, which
  # GitHub Pages serves as https://interledger.github.io/mockgatehub/.
  #
  # Needs `docker` and not just `release`: an index entry pointing at an image
  # that failed to build is worse than no entry at all, because a consumer
  # resolves the chart, deploys it, and gets ImagePullBackOff instead of a
  # failure at the point the mistake was made.
  chart:
    name: Publish Helm Chart
    needs: [release, docker]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    env:
      # No leading `v`. This becomes both the chart version and the appVersion,
      # and appVersion is used directly as an image tag.
      VERSION: ${{ needs.release.outputs.new_release_version }}
      PAGES_URL: https://interledger.github.io/mockgatehub/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A second, separate checkout rather than switching branches in place.
      # `git checkout --orphan` keeps the index, so the next `git add` stages
      # the entire source tree into the publish branch -- a mistake that is
      # invisible until someone browses the branch. Two directories cannot make
      # it. It also means this job never has to know how to create the branch:
      # if `published` is missing, checkout fails here and says so, instead of
      # inventing one.
      - name: Checkout the published branch
        uses: actions/checkout@v4
        with:
          ref: published
          path: .published

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Package the chart
        run: |
          set -euo pipefail
          # The same target a developer runs. A no-op while charts/*.tgz is
          # vendored, which it is.
          make helm-deps
          mkdir -p .published/docs
          # Chart.yaml carries 0.0.0 in git; the real version is stamped here,
          # so there is no version to bump by hand and none to forget. A
          # forgotten bump would not fail -- `helm repo index --merge` keeps the
          # existing entry and the publish looks successful while changing
          # nothing.
          helm package helm/mockgatehub \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination .published/docs

      - name: Regenerate the repository index
        run: |
          set -euo pipefail
          cd .published
          # --merge is not optional. Without it the index describes only the
          # chart packaged in this run, and every previously published version
          # becomes unresolvable even though its .tgz is still sitting next to
          # it -- which reads as "the repo is broken" rather than "the index is
          # truncated".
          if [ -f docs/index.yaml ]; then
            helm repo index docs --url "${PAGES_URL}" --merge docs/index.yaml
          else
            helm repo index docs --url "${PAGES_URL}"
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          cd .published
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          # A re-run for a version already published should be a successful
          # no-op, not a failed `git commit` reported as a red release.
          if git diff --cached --quiet; then
            echo "Chart ${VERSION} is already published; nothing to do."
            exit 0
          fi
          git commit -m "chore(chart): publish mockgatehub ${VERSION}"
          git push origin published

      - name: Summary
        run: |
          {
            echo "### Helm chart published"
            echo
            echo '```'
            echo "helm repo add mockgatehub ${PAGES_URL}"
            echo "helm repo update"
            echo "helm install mockgatehub mockgatehub/mockgatehub --version ${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
