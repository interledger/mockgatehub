name: PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  # Validate PR title follows Conventional Commits
  check-pr-title:
    name: Check PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  # Run unit and integration tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache Go build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit and integration tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          files: ./coverage.out
          flags: unittests

  # Run e2e tests (requires Docker)
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache Go build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run feature e2e tests
        run: go test -tags e2e -v -count=1 ./testenv/ -run TestFeatures

  # Validate the Helm chart: lint, unit tests and schema validation of the
  # rendered manifests. Fast and needs no cluster.
  helm:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 0.8.1

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Lint, unit test and validate the chart
        run: make helm-test

  # Install the chart on a throwaway cluster. This is the check that catches
  # what rendering cannot: that the pods actually start, MockGatehub reaches
  # Valkey, and the two listeners serve what they should.
  helm-install:
    name: Install Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image under test
        uses: docker/build-push-action@v6
        with:
          context: .
          # Single arch and loaded locally: this image is only for the kind node.
          platforms: linux/amd64
          push: false
          load: true
          tags: mockgatehub:ci
          # A distinct cache scope: the build job below caches a multi-arch
          # build, and sharing a scope between the two would thrash it.
          cache-from: type=gha,scope=helm-install
          cache-to: type=gha,scope=helm-install,mode=max

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: mockgatehub-ci

      - name: Load the image into kind
        run: kind load docker-image mockgatehub:ci --name mockgatehub-ci

      - name: Install the chart
        run: |
          helm install mgh helm/mockgatehub \
            --set image.repository=mockgatehub \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set config.webhookUrl=http://mgh-mockgatehub:8080/health \
            --wait --timeout 5m

      - name: MockGatehub connected to Valkey
        run: |
          kubectl logs deploy/mgh-mockgatehub | tee /tmp/mgh.log
          grep -q "connected to redis" /tmp/mgh.log
          grep -q "webhook worker started" /tmp/mgh.log

      - name: Started without crash-looping
        # The init container waits for Valkey; without it the app exits and
        # restarts until Valkey accepts connections.
        run: |
          restarts=$(kubectl get pods -l app.kubernetes.io/name=mockgatehub \
            -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}')
          echo "restarts: $restarts"
          test "$restarts" -eq 0

      - name: Each listener serves only its own surface
        # Asserted in-cluster rather than by rendering, since this is about the
        # running process. The NetworkPolicy's own content is covered by the
        # chart unit tests, which do not depend on the CNI enforcing policy.
        run: |
          kubectl run probe --image=curlimages/curl:8.11.1 --restart=Never \
            --command -- sleep 300
          kubectl wait --for=condition=ready pod/probe --timeout=120s

          code() {
            kubectl exec probe -- curl -s -o /dev/null -w '%{http_code}' -m 10 "$1"
          }

          echo "application listener"
          test "$(code http://mgh-mockgatehub:8080/health)" = "200"
          # The admin surface must not be served here.
          test "$(code http://mgh-mockgatehub:8080/ui)" = "401"

          echo "admin listener"
          test "$(code http://mgh-mockgatehub-admin:8081/health)" = "200"
          test "$(code http://mgh-mockgatehub-admin:8081/ui)" = "200"
          # The application surface must not be served there.
          test "$(code http://mgh-mockgatehub-admin:8081/iframe/onboarding)" = "404"

      - name: Persistence survives a restart of Valkey
        run: |
          kubectl exec deploy/mgh-valkey -- valkey-cli SET ci-probe survived
          kubectl exec deploy/mgh-valkey -- valkey-cli SAVE
          kubectl delete pod -l app.kubernetes.io/name=valkey --wait=true
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=valkey --timeout=180s
          test "$(kubectl exec deploy/mgh-valkey -- valkey-cli GET ci-probe)" = "survived"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get all,pvc,networkpolicy -o wide || true
          kubectl describe pods || true
          kubectl logs deploy/mgh-mockgatehub --all-containers --tail=100 || true
          kubectl logs deploy/mgh-valkey --tail=50 || true

  # Build Docker image (but don't push)
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
