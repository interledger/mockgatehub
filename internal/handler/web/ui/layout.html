{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}} — MockGatehub</title>
<style>
:root { color-scheme: light dark; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  margin: 0; padding: 0 1.5rem 3rem; line-height: 1.5;
  background: Canvas; color: CanvasText;
}
header { padding: 1.25rem 0; border-bottom: 1px solid #8884; margin-bottom: 1.5rem; }
h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
h2 { font-size: 1rem; margin: 2rem 0 .75rem; }
nav a { margin-right: 1rem; }
a { color: #0b69d4; }
table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; font-size: .9rem; }
th, td { border: 1px solid #8884; padding: .4rem .6rem; text-align: left; vertical-align: top; }
th { background: #8881; font-weight: 600; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
code, pre, textarea, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }
textarea { width: 100%; min-height: 16rem; }
label { display: block; margin: .75rem 0 .25rem; font-weight: 600; font-size: .85rem; }
select, input[type=text], input[type=number] { width: 100%; max-width: 34rem; padding: .35rem; }
button { margin-top: 1rem; padding: .45rem 1rem; cursor: pointer; }
.flash { padding: .6rem .8rem; border-radius: 4px; margin-bottom: 1rem; }
.flash.ok { background: #1a7f3720; border: 1px solid #1a7f37; }
.flash.err { background: #cf222e20; border: 1px solid #cf222e; }
.muted { color: #8888; }
.row { display: flex; gap: 2rem; flex-wrap: wrap; }
.row > * { flex: 1 1 20rem; }
fieldset { border: 1px solid #8884; border-radius: 4px; margin: 0 0 1rem; }
</style>
</head>
<body>
<header>
  <h1>MockGatehub</h1>
  <nav>
    <a href="/ui">Users</a>
    <a href="/ui/actions/kyc">KYC event</a>
    <a href="/ui/actions/card-transaction">Card transaction</a>
  </nav>
</header>
{{if .Flash}}<p class="flash {{if .FlashIsError}}err{{else}}ok{{end}}">{{.Flash}}</p>{{end}}
{{template "content" .}}
</body>
</html>{{end}}
