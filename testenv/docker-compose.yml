services:
  redis:
    image: redis:7-alpine
    container_name: mockgatehub-test-redis
    ports:
      - "26380:6379"  # Use different port to avoid conflicts
    command: redis-server --save "" --appendonly no  # No persistence
    networks:
      - mockgatehub-test

  mockgatehub:
    build:
      context: ..
      dockerfile: Dockerfile
    # container_name: mockgatehub-test
    ports:
      - "25151:8080"  # Application API
      - "25153:8081"  # Admin UI and test-support endpoints
    environment:
      - LOG_LEVEL=debug
      - MOCKGATEHUB_PORT=8080
      - MOCKGATEHUB_ADMIN_PORT=8081
      - MOCKGATEHUB_REDIS_URL=redis://redis:6379
      - MOCKGATEHUB_REDIS_DB=0
      # The webhook sink lives on the admin listener now.
      - WEBHOOK_URL=http://mockgatehub:8081/test-webhook
      - WEBHOOK_SECRET=test-webhook-secret
      - MOCKGATEHUB_ENFORCE_AUTHENTICATION=true
    depends_on:
      - redis
    networks:
      - mockgatehub-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # A second instance with asynchronous withdrawals enabled. The behaviour is
  # opt-in, so both positions of the switch need covering, and the default
  # instance above must keep settling withdrawals immediately.
  mockgatehub-async:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "25152:8080"  # Application API
      - "25154:8081"  # Admin UI and test-support endpoints
    environment:
      - LOG_LEVEL=debug
      - MOCKGATEHUB_PORT=8080
      - MOCKGATEHUB_ADMIN_PORT=8081
      - MOCKGATEHUB_REDIS_URL=redis://redis:6379
      # A separate Redis database so the two instances do not share state or
      # consume each other's webhook queue.
      - MOCKGATEHUB_REDIS_DB=1
      - WEBHOOK_URL=http://mockgatehub-async:8081/test-webhook
      - WEBHOOK_SECRET=test-webhook-secret
      - MOCKGATEHUB_ENFORCE_AUTHENTICATION=true
      - MOCKGATEHUB_ASYNC_WITHDRAWALS=true
    depends_on:
      - redis
    networks:
      - mockgatehub-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  mockgatehub-test:
    driver: bridge
